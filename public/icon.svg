  <!-- Escudo Central -->
  <g filter="url(#shieldShadow)">
    <path d="M 235,230 C 235,230 300,218 365,230 C 365,335 348,390 300,432 C 252,390 235,335 235,230 Z" fill="#ffffff" stroke="url(#shieldGoldRim)" stroke-width="8" stroke-linejoin="round" />
    <path d="M 240,235 C 240,235 300,225 360,235 L 360,274 C 330,270 270,270 240,274 Z" fill="#64748b" stroke="url(#goldBevel)" stroke-width="2" />
    <text x="300" y="253" text-anchor="middle" fill="#ffffff" font-family="'Cinzel', serif" font-size="12.5" font-weight="bold" letter-spacing="0.8">GUERREROS</text>
    <text x="300" y="267" text-anchor="middle" fill="#fef08a" font-family="'Cinzel', serif" font-size="9.5" font-weight="600" letter-spacing="1">DE LA LUZ</text>
    <text x="263" y="312" text-anchor="middle" fill="#0f172a" font-family="'Cinzel', serif" font-size="26" font-weight="bold">A</text>
    <path d="M 300,288 C 298,282 302,282 300,288 C 296,286 295,291 298,293 C 296,295 300,296 300,298 C 300,296 304,295 302,293 C 305,291 304,286 300,288 Z" fill="#d97706" />
    <text x="337" y="312" text-anchor="middle" fill="#0f172a" font-family="'Cinzel', serif" font-size="26" font-weight="bold">C</text>
    <circle cx="300" cy="358" r="33" fill="url(#blueMedallionGrad)" stroke="url(#goldBevel)" stroke-width="3" />
    <circle cx="300" cy="358" r="28" stroke="#ffffff" stroke-width="1.2" fill="none" />
    <polygon points="300,336 276,375 324,375" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
    <g transform="translate(300, 357) scale(0.95)">
      <path d="M 0,-6 C -4,-12 -12,-8 -9,-2 C -11,-1 -13,3 -15,7 C -10,6 -5,3 -2,1 C -3,5 -4,9 -4,13 C 0,9 4,4 5,0 C 9,3 13,6 16,8 C 14,4 12,0 9,-2 C 12,-6 6,-11 0,-6 Z" fill="#ffffff" />
    </g>
  </g>
</svg>
