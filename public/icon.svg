<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" fill="none">
  <defs>
    <radialGradient id="goldPlate" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#eab308" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="75%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="shieldGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="blueMedallionGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="goldDrop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.4" />
    </filter>
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.5" />
    </filter>
    <path id="arcTopText" d="M 68,300 A 232,232 0 1,1 532,300" fill="none" />
    <path id="arcBottomText" d="M 532,300 A 232,232 0 0,1 68,300" fill="none" />
  </defs>

  <circle cx="300" cy="300" r="280" fill="url(#goldPlate)" />

  <!-- Geometría sagrada / Flor de la vida -->
  <g stroke="#ca8a04" stroke-width="1.2" stroke-opacity="0.45" fill="none">
    <circle cx="300" cy="300" r="185" stroke-width="1.8" />
    <circle cx="300" cy="300" r="120" />
    <circle cx="300" cy="300" r="60" />
    <circle cx="300" cy="240" r="60" />
    <circle cx="352" cy="270" r="60" />
    <circle cx="352" cy="330" r="60" />
    <circle cx="300" cy="360" r="60" />
    <circle cx="248" cy="330" r="60" />
    <circle cx="248" cy="270" r="60" />
    <circle cx="300" cy="180" r="120" />
    <circle cx="404" cy="240" r="120" />
    <circle cx="404" cy="360" r="120" />
    <circle cx="300" cy="420" r="120" />
    <circle cx="196" cy="360" r="120" />
    <circle cx="196" cy="240" r="120" />
  </g>

  <!-- Aro exterior grabado en oro -->
  <g filter="url(#goldDrop)">
    <circle cx="300" cy="300" r="282" stroke="url(#goldBevel)" stroke-width="4" />
    <circle cx="300" cy="300" r="275" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="300" cy="300" r="248" stroke="url(#goldBevel)" stroke-width="32" fill="none" opacity="0.12" />
    <circle cx="300" cy="300" r="264" stroke="#ca8a04" stroke-width="1.5" fill="none" />
    <circle cx="300" cy="300" r="232" stroke="#ca8a04" stroke-width="2" fill="none" />
    <circle cx="300" cy="300" r="226" stroke="#eab308" stroke-width="1" stroke-dasharray="2 2" fill="none" />

    <!-- Nudos heráldicos -->
    <g transform="translate(68, 300)">
      <path d="M -10,-8 C -18,-14 -18,14 -10,8 C -4,3 4,3 10,8 C 18,14 18,-14 10,-8 C 4,-3 -4,-3 -10,-8 Z" fill="none" stroke="url(#goldBevel)" stroke-width="2.5" />
      <circle cx="0" cy="0" r="3" fill="#ca8a04" />
    </g>
    <g transform="translate(532, 300)">
      <path d="M -10,-8 C -18,-14 -18,14 -10,8 C -4,3 4,3 10,8 C 18,14 18,-14 10,-8 C 4,-3 -4,-3 -10,-8 Z" fill="none" stroke="url(#goldBevel)" stroke-width="2.5" />
      <circle cx="0" cy="0" r="3" fill="#ca8a04" />
    </g>

    <!-- Texto superior e inferior -->
    <text fill="url(#goldTextGrad)" font-family="'Cinzel', 'Times New Roman', serif" font-size="24" font-weight="bold" letter-spacing="5">
      <textPath href="#arcTopText" startOffset="50%" text-anchor="middle">
        FRATERNIDAD DE LA LUZ
      </textPath>
    </text>
    <text fill="url(#goldTextGrad)" font-family="'Cinzel', 'Times New Roman', serif" font-size="20" font-weight="bold" letter-spacing="4">
      <textPath href="#arcBottomText" startOffset="50%" text-anchor="middle">
        POR EL HONOR DE SERVIR VIVIMOS
      </textPath>
    </text>
  </g>

  <!-- Medallones radiales de las zonas -->
