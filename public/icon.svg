      <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-family="serif" font-size="15" font-weight="bold">D</text>
    </g>
    <g transform="translate(390, 204)">
      <circle cx="0" cy="0" r="22" fill="#334155" stroke="url(#goldBevel)" stroke-width="2.5" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="serif" font-size="11" font-weight="bold">CSG</text>
    </g>
    <g transform="translate(442, 260)">
      <circle cx="0" cy="0" r="22" fill="#475569" stroke="url(#goldBevel)" stroke-width="2.5" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="serif" font-size="11" font-weight="bold">TC</text>
    </g>
    <g transform="translate(450, 326)">
      <circle cx="0" cy="0" r="22" fill="#0284c7" stroke="url(#goldBevel)" stroke-width="2.5" />
      <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-family="serif" font-size="14" font-weight="bold">D</text>
    </g>
    <g transform="translate(440, 392)">
      <circle cx="0" cy="0" r="22" fill="#86198f" stroke="url(#goldBevel)" stroke-width="2.5" />
      <path d="M 0,8 L 0,-3 M -7,-9 C -12,-3 -5,5 0,7 C 5,5 12,-3 7,-9 C 3,-13 -3,-13 -7,-9 Z" fill="#ffffff" />
    </g>
    <g transform="translate(390, 442)">
      <circle cx="0" cy="0" r="22" fill="#09090b" stroke="url(#goldBevel)" stroke-width="2.5" />
      <path d="M 0,8 L 0,-3 M -7,-9 C -12,-3 -5,5 0,7 C 5,5 12,-3 7,-9 C 3,-13 -3,-13 -7,-9 Z" fill="#ffffff" />
    </g>
    <g transform="translate(348, 474)">
      <circle cx="0" cy="0" r="20" fill="#0284c7" stroke="url(#goldBevel)" stroke-width="2.5" />
      <path d="M 0,6 L 0,-2 M -6,-7 C -10,-2 -4,4 0,6 C 4,4 10,-2 6,-7 C 2,-11 -2,-11 -6,-7 Z" fill="#ffffff" />
    </g>
    <g transform="translate(300, 468)">
      <circle cx="0" cy="0" r="22" fill="#c2410c" stroke="url(#goldBevel)" stroke-width="2.5" />
      <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-family="serif" font-size="13" font-weight="bold">TL</text>
    </g>
    <g transform="translate(252, 474)">
      <circle cx="0" cy="0" r="20" fill="#059669" stroke="url(#goldBevel)" stroke-width="2.5" />
      <path d="M 0,6 L 0,-2 M -6,-7 C -10,-2 -4,4 0,6 C 4,4 10,-2 6,-7 C 2,-11 -2,-11 -6,-7 Z" fill="#ffffff" />
    </g>
    <g transform="translate(204, 442)">
      <circle cx="0" cy="0" r="22" fill="#dc2626" stroke="url(#goldBevel)" stroke-width="2.5" />
      <path d="M 0,4 Q -6,-3 -11,1 Q -7,-8 0,-6 Q 7,-8 11,1 Q 6,-3 0,4 Z" fill="#fde047" />
    </g>
    <g transform="translate(160, 392)">
      <circle cx="0" cy="0" r="22" fill="#f43f5e" stroke="url(#goldBevel)" stroke-width="2.5" />
      <path d="M 0,8 L 0,-3 M -7,-9 C -12,-3 -5,5 0,7 C 5,5 12,-3 7,-9 C 3,-13 -3,-13 -7,-9 Z" fill="#ffffff" />
    </g>
    <g transform="translate(150, 326)">
      <circle cx="0" cy="0" r="22" fill="#65a30d" stroke="url(#goldBevel)" stroke-width="2.5" />
      <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-family="serif" font-size="13" font-weight="bold">D</text>
    </g>
    <g transform="translate(160, 260)">
      <circle cx="0" cy="0" r="22" fill="#78350f" stroke="url(#goldBevel)" stroke-width="2.5" />
      <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-family="serif" font-size="13" font-weight="bold">PL</text>
    </g>
    <g transform="translate(204, 204)">
      <circle cx="0" cy="0" r="22" fill="#ea580c" stroke="url(#goldBevel)" stroke-width="2.5" />
      <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-family="serif" font-size="14" font-weight="bold">J</text>
    </g>
